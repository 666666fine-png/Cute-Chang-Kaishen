<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>凯申 · 摸头小游戏</title>
<style>
:root{--paper:#e9e4d8;--ink:#2c2924;--line:#d8d0bd}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  background:radial-gradient(circle at 50% -10%,#f5f1e6,var(--paper) 72%);
  color:var(--ink);-webkit-user-select:none;user-select:none;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;
  background-image:radial-gradient(#8c8574 .5px,transparent .5px);background-size:6px 6px}
.app{width:100%;max-width:420px;padding:18px 16px 26px;position:relative}

/* 顶部 */
.top{display:flex;align-items:center;justify-content:space-between}
.brand h1{margin:0;font-size:30px;letter-spacing:5px;line-height:1.1;
  font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:700}
.brand p{margin:5px 0 0;font-size:10px;letter-spacing:2.2px;color:#918a7b}
.tools{display:flex;gap:8px}
.icon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.55);font-size:15px;color:#5a5346;cursor:pointer;
  display:grid;place-items:center;transition:.15s;font-family:inherit}
.icon:hover{background:#fff;transform:translateY(-2px)}
.icon:active{transform:scale(.92)}

/* 数值 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 12px}
.stat{background:rgba(255,255,255,.58);border:1px solid rgba(0,0,0,.055);
  border-radius:14px;padding:10px 14px 11px;box-shadow:0 2px 8px rgba(60,52,38,.05)}
.lab{font-size:11px;color:#7e786a;letter-spacing:1px;display:flex;align-items:center;gap:6px;height:20px}
.lab em{font-style:normal;font-size:9px;opacity:.55;letter-spacing:1px}
.val{font-size:30px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;
  letter-spacing:-1px;transform-origin:left center;color:#9c7520}
.val.bump,.cb-n.bump{animation:bump .28s cubic-bezier(.2,1.7,.4,1)}
@keyframes bump{0%{transform:scale(1)}42%{transform:scale(1.2)}100%{transform:scale(1)}}
.max{display:none;font-size:9px;background:#b8892a;color:#fff;padding:1px 5px;border-radius:4px;letter-spacing:1px}
.max.on{display:inline-block;animation:bump .4s}
.bar{height:4px;background:#e4dcc9;border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#e0bd58,#b1842a);transition:width .12s linear}
.cbs{display:flex;gap:16px;align-items:baseline;margin:2px 0 0}
.cb{display:flex;align-items:baseline;gap:5px;opacity:.36;transition:opacity .2s,transform .2s}
.cb.active{opacity:1;transform:translateY(-1px)}
.cb-n{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.24;
  transform-origin:left center}
.cb-t{font-size:10px;color:#7e786a;white-space:nowrap}
#cbHit.active .cb-n{color:#9c7520}
#cbPet.active .cb-n{color:#b2646c}
.coin{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:50%;background:radial-gradient(circle at 35% 28%,#f8e2a4,#c99a35 68%,#8a651c);
  color:#5a4114;font-size:11px;font-weight:800;line-height:1;
  box-shadow:0 1px 2px rgba(0,0,0,.22);flex:none}

/* 舞台：背景板静止，人物层单独动画 */
.stage{position:relative;width:100%;aspect-ratio:1080/1360;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#9b988f 0%,#c2bfb8 30%,#dedbd4 60%,#e7e4de 71%,
  #4f4d4b 71.2%,#4f4d4b 100%);
  box-shadow:0 14px 30px rgba(50,45,35,.18),0 2px 6px rgba(0,0,0,.08);perspective:900px}
.backdrop,.cat{position:absolute;top:0;left:0;width:100%;aspect-ratio:1080/1598}
.backdrop{pointer-events:none}
.cat{transform-origin:50% 78%;will-change:transform}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;
  pointer-events:none;-webkit-user-drag:none}
.head{transform-origin:50% 42%;transition:transform .13s ease-out;will-change:transform}
.head.bonk{animation:bonk .44s cubic-bezier(.3,.7,.4,1)}
@keyframes bonk{
  0%{transform:rotate(0) scale(1) translateY(0)}
  12%{transform:rotate(-8deg) scale(1.04,.93) translateY(7px)}
  30%{transform:rotate(6.5deg) scale(1.02,.97) translateY(2px)}
  48%{transform:rotate(-4.5deg) scale(1,.99)}
  66%{transform:rotate(3deg)}
  84%{transform:rotate(-1.5deg)}
  100%{transform:rotate(0) scale(1) translateY(0)}}
.glow{position:absolute;left:24%;top:21%;width:52%;height:30%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,212,125,.75),rgba(255,212,125,0) 70%);
  mix-blend-mode:screen;opacity:0;transition:opacity .3s;pointer-events:none}
.cat.petting .glow{opacity:.6}
.shadow{position:absolute;left:28%;top:75.5%;width:44%;height:4.5%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.34),rgba(0,0,0,0) 72%);pointer-events:none}
.stage.dancing .shadow{animation:shadowPulse .5s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{opacity:.85;transform:scaleX(1)}50%{opacity:.45;transform:scaleX(.82)}}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(42,37,29,.13) 0%,rgba(42,37,29,0) 30%),
  radial-gradient(ellipse 66% 56% at 50% 40%,rgba(0,0,0,0) 58%,rgba(28,24,18,.18) 100%)}
.hitbox{position:absolute;left:23%;top:20%;width:54%;height:30%;border-radius:50%;
  z-index:3;cursor:pointer;touch-action:none;pointer-events:auto}
.guide{position:absolute;left:50%;top:18%;z-index:2;pointer-events:none;
  animation:floaty 2.2s ease-in-out infinite}
.guide span{position:relative;display:inline-block;background:rgba(38,34,28,.82);
  color:#f7e9c6;font-size:11px;padding:5px 12px;border-radius:999px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(0,0,0,.2)}
.guide span::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;
  background:rgba(38,34,28,.82);transform:translateX(-50%) rotate(45deg);border-radius:1px}
@keyframes floaty{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.p{position:absolute;line-height:1;will-change:transform,opacity;
  animation:fly .95s cubic-bezier(.2,.7,.3,1) forwards;text-shadow:0 2px 6px rgba(0,0,0,.32)}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}
  14%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
.toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-10px);
  background:rgba(38,34,28,.88);color:#f7e8c2;border:1px solid rgba(233,201,122,.32);
  padding:7px 15px;border-radius:999px;font-size:12px;letter-spacing:.5px;white-space:nowrap;
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;z-index:6;
  box-shadow:0 4px 14px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 舞蹈：只扭动/弹跳人物，背景板不动 */
.cat.dance-1{animation:d1 .5s ease-in-out 4}
@keyframes d1{
  0%,100%{transform:rotate(0) translateY(0) scale(1)}
  20%{transform:rotate(-8deg) translateY(-4px) scale(.98,1.02)}
  40%{transform:rotate(0) translateY(0) scale(1.03,.97)}
  60%{transform:rotate(8deg) translateY(-4px) scale(.98,1.02)}
  80%{transform:rotate(0) translateY(0) scale(1.03,.97)}}
/* 转圈圈：只在平面内原地转，顺时针 360°（中途头朝下）再反向转回来 */
.cat.dance-2{transform-origin:50% 50%;animation:d2 2.6s linear 1}
@keyframes d2{
  0%{transform:rotate(0deg)}
  23%{transform:rotate(180deg)}
  46%{transform:rotate(360deg)}
  54%{transform:rotate(360deg)}
  77%{transform:rotate(180deg)}
  100%{transform:rotate(0deg)}}
.cat.dance-3{animation:d3 .55s ease-in-out 4}
@keyframes d3{
  0%,100%{transform:translateY(0) scale(1,1)}
  15%{transform:translateY(-36px) scale(.96,1.06)}
  35%{transform:translateY(0) scale(1.08,.9)}
  55%{transform:translateY(-22px) scale(.97,1.04)}
  75%{transform:translateY(0) scale(1.05,.94)}}
.cat.dance-4{animation:d4 .12s linear 16}
@keyframes d4{0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-5px,2px) rotate(-2deg)}
  50%{transform:translate(4px,-3px) rotate(1.5deg)}
  75%{transform:translate(-3px,3px) rotate(-1deg)}
  100%{transform:translate(3px,-1px) rotate(1deg)}}

/* 下方 */
.hint{font-size:11px;color:#8b8474;text-align:center;margin:13px 0 17px;line-height:1.8}
.hint b{color:#6a5a33}
.hint .coin{width:15px;height:15px;font-size:9px;vertical-align:-3px}
.shop-head{font-size:12px;font-weight:700;margin-bottom:10px;color:#4a453b;
  display:flex;justify-content:space-between;align-items:baseline}
.shop-head span{font-size:10px;color:#9a927f;font-weight:400}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.move{display:flex;align-items:center;justify-content:space-between;padding:12px 12px;
  border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6);
  cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
.move:hover{background:#fff;transform:translateY(-2px);box-shadow:0 5px 12px rgba(60,52,38,.1)}
.move:active{transform:scale(.97)}
.mv-name{font-size:14px;font-weight:700;color:#332f28}
.mv-price{font-size:11px;color:#a17d29;display:flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums}
.mv-price .coin{width:16px;height:16px;font-size:9px}
.move.poor{opacity:.48}
.move.poor .mv-price{color:#a49b88}
.shop.busy .move{pointer-events:none;opacity:.5}
footer{font-size:10px;color:#a49c8b;text-align:center;margin-top:20px;letter-spacing:.5px}
@media(max-width:360px){.brand h1{font-size:26px}.val{font-size:26px}.cb-n{font-size:22px}.cbs{gap:10px}.move{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>凯申</h1><p>KAISHEN · 摸头小游戏</p></div>
    <div class="tools">
      <button id="mute" class="icon" title="音效开关">🔊</button>
      <button id="reset" class="icon" title="重新开局">↺</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="lab"><span class="coin">圓</span> 金圆券</div>

    </div>
    <div class="stat">

      </div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var stage=$('#stage'),cat=$('#cat'),head=$('#head'),hit=$('#hitbox'),fx=$('#fx'),
    toast=$('#toast'),guide=$('#guide'),shop=$('#shop'),movesEl=$('#moves'),
    coinsEl=$('#coins'),hitEl=$('#hitCombo'),petEl=$('#petCombo'),
    cbHit=$('#cbHit'),cbPet=$('#cbPet'),fill=$('#comboFill'),maxTag=$('#maxTag'),
    muteBtn=$('#mute');

var KEY='kaishen_coins_v1',MKEY='kaishen_muted_v1',MAXCOMBO=999;
var coins=parseInt(localStorage.getItem(KEY)||'0',10);
if(!isFinite(coins)||coins<0)coins=0;
var hitCombo=0,petCombo=0,curType=null,busy=false,muted=localStorage.getItem(MKEY)==='1';
var ac=null,lastCoinSfx=0,lastReward=0,toastTimer=null,petGlowTimer=null;

var DANCES=[
 {name:'扭一扭',cost:8, cls:'dance-1',dur:2000,note:'♪'},
 {name:'转圈圈',cost:15,cls:'dance-2',dur:2600,note:'♫'},
 {name:'蹦个迪',cost:25,cls:'dance-3',dur:2200,note:'♬'},
 {name:'抖三抖',cost:40,cls:'dance-4',dur:1920,note:'✦'}
];
var MILES={10:'10 连！手感不错',50:'50 连！手速惊人',100:'100 连！黄金右手',
           300:'300 连！停不下来',999:'999 连 · 传说达成 ✦'};

/* ---------- 音效 ---------- */
function ensureAudio(){
  if(muted)return null;
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function tone(f,dur,type,vol,delay,f2){
  var a=ensureAudio();if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.06,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol){
  var a=ensureAudio();if(!a)return;
  var n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  var s=a.createBufferSource();s.buffer=buf;
  var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;
  var g=a.createGain();g.gain.value=vol||.2;
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}
var sfx={
  hit:function(){noise(.12,.25);tone(190,.16,'triangle',.16,0,70)},
  pet:function(){tone(300,.18,'sine',.045,0,470)},
  coin:function(){tone(880,.09,'sine',.03);tone(1320,.13,'sine',.025,.07)},
  deny:function(){tone(240,.16,'square',.025,0,150)},
  dance:function(){[523,659,784,1046].forEach(function(f,i){tone(f,.2,'triangle',.045,i*.11)})}
};
function coinSfx(){var n=performance.now();if(n-lastCoinSfx<95)return;lastCoinSfx=n;sfx.coin()}

/* ---------- 界面 ---------- */
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function say(t,dur){
  toast.textContent=t;toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove('show')},dur||1100);
}
function updateUI(){
  coinsEl.textContent=coins;
  hitEl.textContent=hitCombo;petEl.textContent=petCombo;
  cbHit.classList.toggle('active',curType==='hit');
  cbPet.classList.toggle('active',curType==='pet');
  maxTag.classList.toggle('on',Math.max(hitCombo,petCombo)>=MAXCOMBO);
  var cur=curType==='hit'?hitCombo:(curType==='pet'?petCombo:0);
  fill.style.width=(cur>0?Math.max(2,cur/MAXCOMBO*100):0)+'%';
  var bs=movesEl.children;
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('poor',coins<DANCES[i].cost);
}
function particle(x,y,txt,color,size){
  if(fx.childElementCount>46)return;
  var p=document.createElement('span');p.className='p';p.textContent=txt;
  p.style.left=x+'%';p.style.top=y+'%';p.style.color=color;
  p.style.fontSize=(size||20)+'px';
  p.style.setProperty('--dx',(Math.random()*70-35)+'px');
  p.style.setProperty('--dy',(-55-Math.random()*65)+'px');
  p.style.setProperty('--rot',(Math.random()*80-40)+'deg');
  fx.appendChild(p);
  setTimeout(function(){p.remove()},1000);
}

/* ---------- 连击：打与摸分开，切换即清零 ---------- */
function reward(type){
  coins++;localStorage.setItem(KEY,String(coins));
  if(curType!==type){hitCombo=0;petCombo=0;curType=type}
  var c;
  if(type==='hit'){if(hitCombo<MAXCOMBO)hitCombo++;c=hitCombo}
  else{if(petCombo<MAXCOMBO)petCombo++;c=petCombo}
  lastReward=performance.now();
  updateUI();bump(coinsEl);bump(type==='hit'?hitEl:petEl);coinSfx();
  particle(44+Math.random()*12,22+Math.random()*8,'+1','#f0cf72',15);
  if(MILES[c]){
    say((type==='hit'?'打击 ':'抚摸 ')+MILES[c],1600);
    for(var i=0;i<10;i++)particle(18+Math.random()*64,24+Math.random()*24,'✦','#f2cf6a',13+Math.random()*12);
  }
}
function doHit(){
  if(busy)return;
  head.className='layer head';head.style.transform='';void head.offsetWidth;
  head.className='layer head bonk';
  setTimeout(function(){if(head.classList.contains('bonk'))head.className='layer head'},460);
  sfx.hit();reward('hit');
  var syms=['✦','★','✧','💢'];
  for(var i=0;i<4;i++)particle(28+Math.random()*44,24+Math.random()*15,syms[i],
    i===3?'#ff9563':'#f4d06a',16+Math.random()*11);
}
function doPet(){
  if(busy)return;
  sfx.pet();reward('pet');
  cat.classList.add('petting');
  clearTimeout(petGlowTimer);
  petGlowTimer=setTimeout(function(){cat.classList.remove('petting')},700);
  var s=Math.random()<.72?'♥':'♪';
  particle(34+Math.random()*32,26+Math.random()*12,s,
    s==='♥'?'#e8a2a2':'#f0cf7a',14+Math.random()*9);
}

/* ---------- 指针：轻点=打，按住左右划=摸 ---------- */
var ptr=null;
function endPtr(e,cancelled){
  if(!ptr||(e&&e.pointerId!==ptr.id))return;
  var p=ptr;ptr=null;
  cat.classList.remove('petting');head.style.transform='';
  if(cancelled)return;
  var dt=performance.now()-p.t0;
  if(!p.moved){
    if(dt<700)doHit();
    else say('按住左右划动才能摸头哦');
  }
}
hit.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  try{hit.setPointerCapture(e.pointerId)}catch(err){}
  var r=hit.getBoundingClientRect();
  ptr={id:e.pointerId,x0:e.clientX,lastX:e.clientX,t0:performance.now(),
       moved:false,dist:0,dir:0,rect:r};
  head.className='layer head';head.style.transform='';
  cat.classList.add('petting');
  if(guide)guide.style.display='none';
});
hit.addEventListener('pointermove',function(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  var dx=e.clientX-ptr.lastX;ptr.lastX=e.clientX;
  var offX=e.clientX-ptr.x0;
  ptr.dist+=Math.abs(dx);
  if(!ptr.moved&&(Math.abs(offX)>10||ptr.dist>16))ptr.moved=true;
  if(!ptr.moved)return;
  var r=ptr.rect,rel=(e.clientX-(r.left+r.width/2))/(r.width/2);
  var tilt=Math.max(-7,Math.min(7,rel*7));
  head.style.transform='rotate('+tilt.toFixed(1)+'deg) translateY(-2px)';
  var dir=Math.sign(dx),now=performance.now();
  var turned=ptr.dir!==0&&dir!==0&&dir!==ptr.dir&&Math.abs(dx)>6;
  if(dir!==0)ptr.dir=dir;
  if(now-lastReward>130&&(ptr.dist>=70||turned)){ptr.dist=0;doPet()}
});
hit.addEventListener('pointerup',function(e){endPtr(e,false)});
hit.addEventListener('pointercancel',function(e){endPtr(e,true)});
hit.addEventListener('lostpointercapture',function(e){if(ptr)endPtr(e,true)});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&!e.repeat){e.preventDefault();if(guide)guide.style.display='none';doHit()}
});

/* ---------- 花金圆券买舞蹈：只有人物扭动弹跳，无任何文字讲解 ---------- */
function dance(i){
  if(busy)return;
  var d=DANCES[i];
  if(coins<d.cost){sfx.deny();say('还差 '+(d.cost-coins)+' 枚金圆券，再摸摸凯申');return}
  coins-=d.cost;localStorage.setItem(KEY,String(coins));
  busy=true;shop.classList.add('busy');stage.classList.add('dancing');updateUI();bump(coinsEl);
  toast.classList.remove('show');toast.textContent='';
  cat.className='cat '+d.cls;
  head.className='layer head';head.style.transform='';
  sfx.dance();
  for(var k=0;k<3;k++)particle(20+Math.random()*60,40+Math.random()*20,d.note,'#f0d27a',16+Math.random()*10);
  var timer=setInterval(function(){
    particle(18+Math.random()*64,38+Math.random()*22,d.note,'#f0d27a',14+Math.random()*10);
  },320);
  setTimeout(function(){
    clearInterval(timer);cat.className='cat';stage.classList.remove('dancing');
    busy=false;shop.classList.remove('busy');updateUI();
  },d.dur);
}
DANCES.forEach(function(d,i){
  var b=document.createElement('button');b.type='button';b.className='move';
  b.innerHTML='<span class="mv-name">'+d.name+'</span><span class="mv-price"><span class="coin">圓</span> '+d.cost+'</span>';
  b.addEventListener('click',function(){dance(i)});
  movesEl.appendChild(b);
});

/* ---------- 其它 ---------- */
function renderMute(){muteBtn.textContent=muted?'🔇':'🔊'}
muteBtn.addEventListener('click',function(){
  muted=!muted;localStorage.setItem(MKEY,muted?'1':'0');renderMute();
  if(!muted){ensureAudio();sfx.coin()}
});
$('#reset').addEventListener('click',function(){
  coins=0;hitCombo=0;petCombo=0;curType=null;localStorage.setItem(KEY,'0');
  cat.className='cat';head.className='layer head';head.style.transform='';
  stage.classList.remove('dancing');updateUI();sfx.deny();say('已重新开局');
});
if(coins>0&&guide)guide.style.display='none';
renderMute();updateUI();
})();
</script>
</body>
